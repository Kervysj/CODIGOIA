<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Comandos IA</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--line:#27304a;--tx:#e8ecf4;--mut:#93a0bd;--ac:#7c9cff;--ok:#5fd6a0;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--mut);font-size:.85rem;margin-left:6px}
#q{width:100%;margin-top:10px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit}
#q:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
#cats button{flex:none;border:1px solid var(--line);background:none;color:var(--mut);padding:6px 13px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}
#cats button.on{background:var(--ac);color:#0b1020;border-color:var(--ac);font-weight:600}
main{max-width:760px;margin:0 auto;padding:6px 14px 60px}
h2{font-size:.95rem;font-weight:600;color:var(--mut);margin:20px 0 8px}
.row{display:grid;grid-template-columns:28px minmax(140px,190px) 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.n{color:var(--mut);font-size:.8rem;text-align:right}
.cmd{font:600 .95rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:left;padding:9px 11px;border-radius:8px;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel);color:var(--ac);cursor:pointer;overflow-wrap:anywhere}
.cmd:active{transform:translateY(2px);border-bottom-width:1px}
.cmd.ok{color:var(--ok);border-color:var(--ok)}
.d{font-size:.93rem}
@media(max-width:480px){.row{grid-template-columns:24px 1fr}.d{grid-column:2}}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ok);color:#06231a;padding:9px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#t.s{opacity:1}
.none{color:var(--mut);padding:30px 0;text-align:center}
</style>
</head>
<body>
<header>
<h1>Comandos IA<small id="c"></small></h1>
<input id="q" type="search" placeholder="Buscar comando o lo que hace…" autocomplete="off">
<div id="cats"></div>
</header>
<main id="m"></main>
<div id="t" role="status">Copiado</div>
<script>
const D=[
["Respuestas rápidas",`human|Escribe de forma natural y humana
expert|Responde a un nivel de experto
ceo|Analiza con la mentalidad de un fundador de empresa
viral|Ideas para contenido altamente viral
seo|Contenido optimizado para buscadores
critic|Identifica debilidades y fallos
teacher|Explicación clara y simple
eli5|Explícalo como si tuviera 5 años
brief|La respuesta más corta posible
strategy|Planificación estratégica a largo plazo
copywriter|Texto persuasivo de marketing`],
["Investigar y analizar",`research|Investigación profunda
brainstorm|Genera ideas creativas
promptengineer|Mejora cualquier prompt
summarize|Resume los puntos principales
simplify|Simplifica contenido complejo
detailed|Proporciona una explicación detallada
stepbystep|Explica paso a paso
examples|Proporciona ejemplos prácticos
analyst|Analiza datos o información
compare|Compara múltiples opciones
proscons|Presenta los pros y los contras`],
["Productividad y estudio",`decision|Ayuda a tomar la mejor decisión
planner|Crea un plan de acción
roadmap|Crea una hoja de ruta para alcanzar un objetivo
action|Convierte ideas en pasos prácticos
prioritize|Organiza tareas según su importancia
productivity|Mejora la productividad
focus|Identifica la tarea más importante
time|Crea un plan de gestión del tiempo
learn|Crea un plan de aprendizaje
study|Crea una estrategia de estudio efectiva
quiz|Evalúa conocimientos con preguntas`],
["Carrera y mejora de textos",`flashcards|Crea tarjetas de estudio educativas para memorizar
interview|Prepárame para entrevistas
resume|Mejora el contenido de mi currículum
career|Brinda orientación profesional
mentor|Responde como un mentor personal
coach|Proporciona entrenamiento práctico
consultant|Ofrece recomendaciones profesionales
editor|Mejora la claridad y la calidad del texto
proofread|Identifica errores gramaticales y de ortografía
rewrite|Reescribe con un mejor estilo
professional|Haz la redacción más profesional`],
["Tono y redacción",`casual|Haz que la redacción sea más conversacional
friendly|Haz que la redacción sea más cálida y amigable
persuasive|Haz que el mensaje sea más persuasivo
concise|Elimina palabras innecesarias
polish|Mejora la versión final
tone|Ajusta el tono de la redacción
storyteller|Convierte la información en una historia
hook|Crea aperturas que llamen la atención
headline|Crea titulares impactantes
caption|Escribe pies de foto para redes sociales
linkedin|Crea contenido para LinkedIn`],
["Marketing y redes",`instagram|Crea contenido para Instagram
youtube|Crea contenido para YouTube
reels|Genera ideas para videos cortos
script|Escribe un guion de video o presentación
email|Escribe un correo electrónico efectivo
sales|Crea mensajes enfocados en ventas
offer|Crea una oferta irresistible
brand|Desarrolla un mensaje de marca
customer|Piensa desde la perspectiva del cliente
audience|Analiza la audiencia objetivo
competitor|Analiza a la competencia`],
["Negocios y creatividad",`market|Analiza oportunidades de mercado
startup|Piensa como un estratega experto en startups
business|Desarrolla ideas de negocio
pricing|Desarrolla una estrategia de precios
funnel|Crea un embudo de marketing
growth|Identifica oportunidades de crecimiento
content|Desarrolla una estrategia de contenido
calendar|Crea un calendario de contenido
ideas|Genera nuevas ideas
creative|Piensa de forma creativa y diferente
unpopular|Cuestiona ideas convencionales`],
["Pensamiento crítico y problemas",`devilsadvocate|Discute el punto de vista contrario
contrarian|Descubre puntos de vista alternativos
assumptions|Identifica suposiciones ocultas
risks|Identifica posibles riesgos
factcheck|Separa los hechos de las opiniones
verify|Identifica qué necesita ser verificado
logic|Examina el razonamiento y la lógica
rootcause|Identifica la causa raíz del problema
debug|Identifica problemas y propón soluciones
solution|Genera soluciones prácticas
alternative|Sugiere mejores alternativas`],
["Formatos y avanzados",`optimize|Mejora un enfoque existente
automate|Encuentra formas de automatizar la tarea
template|Crea una plantilla reutilizable
checklist|Crea una lista de verificación práctica
framework|Construye un marco de trabajo organizado
matrix|Organiza opciones en una matriz de decisión
table|Convierte información en una tabla
json|Estructura la respuesta en formato JSON
roleplay|Simula un escenario realista
reverse|Trabaja desde el resultado deseado hacia atrás
ultimate|Proporciona la respuesta más completa`]];
let n=0;const L=D.map(([c,t])=>({c,i:t.split("\n").map(l=>{const[k,d]=l.split("|");return{n:++n,k:"/"+k+":",d}})}));
const $=id=>document.getElementById(id);let cat=-1;
function r(){const q=$("q").value.trim().toLowerCase();let h="",t=0;
L.forEach((g,gi)=>{if(cat>=0&&cat!==gi)return;const it=g.i.filter(x=>!q||(x.k+x.d).toLowerCase().includes(q));if(!it.length)return;t+=it.length;
h+=`<h2>${g.c}</h2>`+it.map(x=>`<div class="row"><span class="n">${x.n}</span><button class="cmd" data-k="${x.k}">${x.k}</button><span class="d">${x.d}</span></div>`).join("")});
$("m").innerHTML=h||'<p class="none">No hay comandos con esa búsqueda.</p>';$("c").textContent=t+" comandos"}
$("cats").innerHTML=['Todos',...L.map(g=>g.c)].map((c,i)=>`<button data-i="${i-1}" class="${i?'':'on'}">${c}</button>`).join("");
$("cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=+b.dataset.i;[...$("cats").children].forEach(x=>x.classList.toggle("on",x===b));r()};
$("q").oninput=r;
let tm;$("m").onclick=async e=>{const b=e.target.closest(".cmd");if(!b)return;const v=b.dataset.k+" ";
try{await navigator.clipboard.writeText(v)}catch(_){const a=document.createElement("textarea");a.value=v;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
b.classList.add("ok");$("t").textContent="Copiado: "+b.dataset.k;$("t").classList.add("s");clearTimeout(tm);tm=setTimeout(()=>{$("t").classList.remove("s");b.classList.remove("ok")},1200)};
r();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
